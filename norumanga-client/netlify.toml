# Cấu hình deploy Flutter Web lên Netlify
#
# QUAN TRỌNG: Thay <YOUR_BACKEND_URL> bằng URL backend thật trên Render
# (ví dụ: https://norumanga-api.onrender.com) trong lệnh build bên dưới.

[build]
  # Thư mục chứa web đã build
  publish = "build/web"
  # Lệnh build — cần truyền URL backend qua --dart-define=API_BASE
  command = """
    git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter && \
    export PATH="$PATH:`pwd`/_flutter/bin" && \
    flutter pub get && \
    flutter build web --release --dart-define=API_BASE=https://CHANGE_ME.onrender.com
  """

# Flutter web dùng client-side routing → mọi đường dẫn trả về index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
