spring.application.name=prm-backend

# Server
server.port=8080

# MongoDB - URI from environment variable
spring.data.mongodb.uri=${MONGODB_URI}

# JWT - from environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Auditing
spring.data.mongodb.auto-index-creation=false

# Active profile (override with -Dspring.profiles.active=dev or env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
